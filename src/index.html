<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>
    // Apply the preference before the page paints to avoid a bright flash.
    (() => {
      let theme;
      try { theme = localStorage.getItem('portfolio-theme'); } catch {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <title>Saad Kabir Uddin | Software Engineer</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Portfolio of Saad Kabir Uddin — Software Engineer specialising in full-stack web development, scalable systems, and applied AI.">
  <link rel="icon" type="image/x-icon" href="newlogo5.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

</body>
</html>
