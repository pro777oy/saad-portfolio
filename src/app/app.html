<a class="skip-link" href="#main-content">Skip to main content</a>

<div class="app-shell">
  <header class="site-header">
    <div class="site-header-inner">
      <div class="site-header-top">
        <a class="brand brand-home-link" routerLink="/" aria-label="Go to home page" (click)="closeMenu()">
          <span class="brand-name">Saad Kabir Uddin</span>
          <span class="brand-role">Software Engineer</span>
        </a>

        <button
          type="button"
          class="nav-toggle"
          [class.is-open]="menuOpen()"
          [attr.aria-expanded]="menuOpen()"
          [attr.aria-label]="menuToggleLabel()"
          aria-controls="primary-navigation"
          (click)="toggleMenu()"
        >
          <span class="sr-only">{{ menuToggleLabel() }}</span>
          <span class="nav-toggle-icon" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </span>
        </button>
      </div>

      <nav
        id="primary-navigation"
        aria-label="Primary navigation"
        [class.mobile-nav-open]="menuOpen()"
      >
        <ul class="nav-list">
          @for (item of navItems(); track item.path) {
            <li>
              <a
                [routerLink]="item.path"
                [routerLinkActive]="'active-link'"
                [routerLinkActiveOptions]="{ exact: item.path === '/' }"
                (click)="closeMenu()"
              >
                {{ item.label }}
              </a>
            </li>
          }
        </ul>
      </nav>
    </div>
  </header>
  <main id="main-content" tabindex="-1" class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
