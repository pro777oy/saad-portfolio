<a class="skip-link" href="#main-content">Skip to main content</a>

<div class="app-shell">
  <header class="site-header">
    <div class="site-header-inner">
      <div class="site-header-top">
        <a class="brand brand-home-link" routerLink="/" aria-label="Go to home page" (click)="closeMenu()">
          <span class="brand-name">Saad Kabir Uddin</span>
          <span class="brand-role">Software Engineer</span>
        </a>

        <div class="header-actions">
        <button
          type="button"
          class="theme-toggle"
          [attr.aria-label]="themeToggleLabel()"
          [attr.title]="themeToggleLabel()"
          (click)="toggleTheme()"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            @if (darkMode()) {
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" />
            } @else {
              <path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z" />
            }
          </svg>
        </button>
        <button
          type="button"
          class="nav-toggle"
          #menuToggle
          [class.is-open]="menuOpen()"
          [attr.aria-expanded]="menuOpen()"
          [attr.aria-label]="menuToggleLabel()"
          aria-controls="primary-navigation"
          (click)="toggleMenu()"
        >
          <span class="sr-only">{{ menuToggleLabel() }}</span>
          <span class="nav-toggle-icon" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </span>
        </button>
        </div>
      </div>

      <nav
        id="primary-navigation"
        aria-label="Primary navigation"
        [class.mobile-nav-open]="menuOpen()"
        (keydown.escape)="closeMenu(); menuToggle.focus()"
      >
        <ul class="nav-list">
          @for (item of navItems(); track item.path) {
            <li>
              <a
                [routerLink]="item.path"
                [routerLinkActive]="'active-link'"
                ariaCurrentWhenActive="page"
                [routerLinkActiveOptions]="{ exact: item.path === '/' }"
                (click)="closeMenu()"
              >
                {{ item.label }}
              </a>
            </li>
          }
        </ul>
      </nav>
    </div>
  </header>
  <main id="main-content" tabindex="-1" class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
